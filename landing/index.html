<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metrico — Construction Project Management</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="home">
  <div class="aurora" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
  <div class="page">
    <div class="shell nav-wrap">
      <nav class="glass-nav" aria-label="Main">
        <div class="brand"><a href="index.html"><img src="logo.png" alt="" /> Metrico</a></div>
        <div class="spacer"></div>
        <div class="nav-menu">
          <a class="nav-link" href="index.html#features" data-i18n="nav.platform"></a>
          <a class="nav-link" href="about.html" data-i18n="nav.about"></a>
          <a class="nav-link" href="guide.html" data-i18n="nav.guide"></a>
          <a class="nav-link" href="contact.html" data-i18n="nav.contact"></a>
          <a class="nav-link" href="privacy.html" data-i18n="nav.privacy"></a>
        </div>
        <button type="button" class="lang-switch" id="lang-switch" data-i18n="lang.switch"></button>
        <a class="nav-cta" data-app-href data-i18n="nav.openApp"></a>
      </nav>
    </div>
    <div class="shell hero">
      <div>
        <div class="eyebrow"><i></i> <span data-i18n="hero.eyebrow"></span></div>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="chips">
          <span class="chip" data-i18n="hero.chip1"></span>
          <span class="chip" data-i18n="hero.chip2"></span>
          <span class="chip" data-i18n="hero.chip3"></span>
          <span class="chip" data-i18n="hero.chip4"></span>
        </div>
        <div class="btns">
          <a class="btn btn-p" data-app-href data-i18n="hero.cta1"></a>
          <a class="btn btn-s" href="contact.html" data-i18n="hero.cta2"></a>
        </div>
        <div class="stats">
          <div class="stat"><strong data-i18n="hero.stat1a"></strong><span data-i18n="hero.stat1b"></span></div>
          <div class="stat"><strong data-i18n="hero.stat2a"></strong><span data-i18n="hero.stat2b"></span></div>
          <div class="stat"><strong data-i18n="hero.stat3a"></strong><span data-i18n="hero.stat3b"></span></div>
        </div>
      </div>
      <div class="hero-visual">
        <div class="hero-photo" aria-hidden="true">
          <img src="assets/hero-tablet.png" data-i18n-alt="hero.imgAlt" alt="" loading="eager" width="900" height="600" />
        </div>
        <div class="float-badge" data-i18n="hero.badge"></div>
      </div>
    </div>
    <div class="shell section-title" id="features">
      <h2 data-i18n="feat.title"></h2>
      <p data-i18n="feat.sub"></p>
    </div>
    <div class="shell infographic">
      <div class="info-block" style="grid-column:1;grid-row:1">
        <h3 data-i18n="feat.d1h"></h3>
        <ul>
          <li data-i18n="feat.d1l1"></li>
          <li data-i18n="feat.d1l2"></li>
          <li data-i18n="feat.d1l3"></li>
        </ul>
      </div>
      <div class="info-block" style="grid-column:3;grid-row:1">
        <h3 data-i18n="feat.d2h"></h3>
        <ul>
          <li data-i18n="feat.d2l1"></li>
          <li data-i18n="feat.d2l2"></li>
          <li data-i18n="feat.d2l3"></li>
        </ul>
      </div>
      <div class="hub" aria-hidden="true">
        <div class="petal p1" title="Units">▦</div>
        <div class="petal p2" title="People">👥</div>
        <div class="petal p3" title="Sites">🏗</div>
        <div class="petal p4" title="Reports">📊</div>
      </div>
      <div class="info-block" style="grid-column:1;grid-row:3">
        <h3 data-i18n="feat.d3h"></h3>
        <ul>
          <li data-i18n="feat.d3l1"></li>
          <li data-i18n="feat.d3l2"></li>
          <li data-i18n="feat.d3l3"></li>
        </ul>
      </div>
      <div class="info-block" style="grid-column:3;grid-row:3">
        <h3 data-i18n="feat.d4h"></h3>
        <ul>
          <li data-i18n="feat.d4l1"></li>
          <li data-i18n="feat.d4l2"></li>
          <li data-i18n="feat.d4l3"></li>
        </ul>
      </div>
    </div>
    <div class="shell section-title" id="capabilities">
      <h2 data-i18n="cap.title"></h2>
      <p data-i18n="cap.sub"></p>
    </div>
    <div class="shell cap-grid">
      <div class="cap c1" tabindex="0"><div class="cap-ring">📈</div><h3 data-i18n="cap.c1t"></h3><p data-i18n="cap.c1p"></p></div>
      <div class="cap c2" tabindex="0"><div class="cap-ring">🤝</div><h3 data-i18n="cap.c2t"></h3><p data-i18n="cap.c2p"></p></div>
      <div class="cap c3" tabindex="0"><div class="cap-ring">📱</div><h3 data-i18n="cap.c3t"></h3><p data-i18n="cap.c3p"></p></div>
      <div class="cap c4" tabindex="0"><div class="cap-ring">💰</div><h3 data-i18n="cap.c4t"></h3><p data-i18n="cap.c4p"></p></div>
      <div class="cap c5" tabindex="0"><div class="cap-ring">🔗</div><h3 data-i18n="cap.c5t"></h3><p data-i18n="cap.c5p"></p></div>
      <div class="cap c6" tabindex="0"><div class="cap-ring">✨</div><h3 data-i18n="cap.c6t"></h3><p data-i18n="cap.c6p"></p></div>
      <div class="cap c7 cap-wide" tabindex="0"><div class="cap-ring">⚙</div><h3 data-i18n="cap.c7t"></h3><p data-i18n="cap.c7p"></p></div>
    </div>
    <div class="shell section-title" id="plans">
      <h2 data-i18n="plans.title"></h2>
    </div>
    <div class="shell plans">
      <div class="plan" tabindex="0"><strong data-i18n="plan.starter"></strong><span data-i18n="plan.starterD"></span></div>
      <div class="plan featured" tabindex="0"><strong data-i18n="plan.plus"></strong><span data-i18n="plan.plusD"></span></div>
      <div class="plan" tabindex="0"><strong data-i18n="plan.pro"></strong><span data-i18n="plan.proD"></span></div>
      <div class="plan" tabindex="0"><strong data-i18n="plan.ark"></strong><span data-i18n="plan.arkD"></span></div>
    </div>
    <div class="shell cta-band">
      <h2 data-i18n="cta.title"></h2>
      <p data-i18n="cta.sub"></p>
      <a class="btn btn-p" data-app-href data-i18n="cta.btn"></a>
    </div>
    <footer>
      <div class="footer-links">
        <a href="about.html" data-i18n="nav.about"></a>
        <a href="guide.html" data-i18n="nav.guide"></a>
        <a href="contact.html" data-i18n="nav.contact"></a>
        <a href="privacy.html" data-i18n="nav.privacy"></a>
      </div>
      <span data-i18n="footer.rights"></span>
    </footer>
  </div>
  <script src="js/i18n.js"></script>
</body>
</html>
