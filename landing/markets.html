<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markets — Metrico</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="markets" data-force-lang="en">
  <div class="aurora" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
  <div class="page">
    <div class="shell nav-wrap">
      <nav class="glass-nav" aria-label="Main">
        <div class="brand"><a href="index.html"><img src="logo.png" alt="" /> Metrico</a></div>
        <div class="spacer"></div>
        <div class="nav-menu">
          <a class="nav-link" href="index.html#features" data-i18n="nav.platform"></a>
          <a class="nav-link active" href="markets.html" data-i18n="nav.markets" data-en-only></a>
          <a class="nav-link" href="about.html" data-i18n="nav.about"></a>
          <a class="nav-link" href="guide.html" data-i18n="nav.guide"></a>
          <a class="nav-link" href="contact.html" data-i18n="nav.contact"></a>
          <a class="nav-link" href="privacy.html" data-i18n="nav.privacy"></a>
        </div>
        <a class="nav-cta" data-app-href data-i18n="nav.openApp"></a>
      </nav>
    </div>

    <div class="shell section-title" style="padding-top:1.5rem">
      <h2 data-i18n="market.title"></h2>
      <p data-i18n="market.sub"></p>
    </div>
    <div class="shell market-innov">
      <h3 data-i18n="market.innovT"></h3>
      <p data-i18n="market.innovP"></p>
    </div>
    <div class="shell market-path" aria-label="Market path">
      <div class="market-step">
        <span class="market-num" data-i18n="market.s1n"></span>
        <strong data-i18n="market.s1t"></strong>
        <span data-i18n="market.s1p"></span>
      </div>
      <div class="market-step">
        <span class="market-num" data-i18n="market.s2n"></span>
        <strong data-i18n="market.s2t"></strong>
        <span data-i18n="market.s2p"></span>
      </div>
      <div class="market-step">
        <span class="market-num" data-i18n="market.s3n"></span>
        <strong data-i18n="market.s3t"></strong>
        <span data-i18n="market.s3p"></span>
      </div>
      <div class="market-step">
        <span class="market-num" data-i18n="market.s4n"></span>
        <strong data-i18n="market.s4t"></strong>
        <span data-i18n="market.s4p"></span>
      </div>
    </div>
    <div class="shell market-grid">
      <article class="market-card">
        <h3 data-i18n="market.m1t"></h3>
        <p data-i18n="market.m1p"></p>
      </article>
      <article class="market-card">
        <h3 data-i18n="market.m2t"></h3>
        <p data-i18n="market.m2p"></p>
      </article>
      <article class="market-card">
        <h3 data-i18n="market.m3t"></h3>
        <p data-i18n="market.m3p"></p>
      </article>
      <article class="market-card market-card-wide">
        <h3 data-i18n="market.m4t"></h3>
        <p data-i18n="market.m4p"></p>
      </article>
    </div>
    <p class="shell market-note" data-i18n="market.note"></p>

    <div class="shell" style="padding-bottom:2.5rem;display:flex;flex-wrap:wrap;gap:0.6rem">
      <a class="btn btn-p" href="onepager.html">Committee one-pager</a>
      <a class="btn btn-s" href="guide.html">Evaluator demo guide</a>
      <a class="btn btn-s" data-app-href data-i18n="nav.openApp"></a>
    </div>

    <footer>
      <div class="footer-links">
        <a href="about.html" data-i18n="nav.about"></a>
        <a href="guide.html" data-i18n="nav.guide"></a>
        <a href="contact.html" data-i18n="nav.contact"></a>
        <a href="privacy.html" data-i18n="nav.privacy"></a>
      </div>
      <span data-i18n="footer.rights"></span>
    </footer>
  </div>
  <script src="js/i18n.js"></script>
</body>
</html>
