name: Smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ops preflight (version + precache assets)
        run: node scripts/ops-preflight.mjs

      - name: Block obvious secrets in tracked source
        run: |
          set -e
          if rg -i "service_role|SUPABASE_SERVICE_ROLE|BEGIN (RSA |OPENSSH )PRIVATE|sk_live_" \
            --glob '!.git/**' --glob '!lib/**' --glob '!backups/**' . ; then
            echo "FAIL: possible secret pattern in repo"
            exit 1
          fi
          echo "OK: no obvious secret patterns"

      - name: Read expected version from repo
        id: ver
        run: |
          node scripts/smoke-check.mjs index.html | tee /tmp/smoke-local.txt
          V=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/smoke-local.txt | head -1)
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Expected APP_VERSION: $V"

      - name: Verify GitHub Pages matches repo (retry for deploy lag)
        env:
          PAGES_URL: https://mehrzad1420.github.io/metrico_by_cursor/index.html
          EXPECT_VERSION: ${{ steps.ver.outputs.value }}
        run: node scripts/smoke-check.mjs "$PAGES_URL"
