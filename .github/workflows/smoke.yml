name: Smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed HTML version (if Pages URL set)
        env:
          PAGES_URL: https://mehrzad1420.github.io/metrico_by_cursor/index.html
        run: |
          node scripts/smoke-check.mjs "$PAGES_URL"
      - name: Verify local index version
        run: node scripts/smoke-check.mjs index.html
